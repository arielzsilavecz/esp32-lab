<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a19" />
  <title>Casa Piotti</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app">
  <main class="page">
    <header class="topbar">
      <div class="topbar-titulo">
        <div class="topbar-titulo-fila">
          <h1>Casa Piotti</h1>
          <div id="conexion-badge" class="conexion-badge" role="status"><span class="punto" aria-hidden="true"></span><span class="conexion-texto">Comprobando conexión...</span></div>
        </div>
        <div id="temperatura-interna" class="temperatura-interna" hidden></div>
      </div>
      <div class="topbar-actions">
        <button id="logout">Salir</button>
      </div>
    </header>
    <div id="dispositivos" class="tablero"></div>
  </main>
  <script src="servidor.js"></script>
  <script src="consumo.js"></script>
  <script src="app.js"></script>
</body>
</html>

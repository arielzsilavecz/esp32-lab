; Proyecto PlatformIO separado, no un environment mas dentro de firmware/: es
; un ESP32 fisico distinto para una aplicacion distinta (sniffer de bus, no
; RF). Cero riesgo de tocar el firmware del porton, ya validado en produccion.
; Ver docs/decisions/0007-alarm-sniffer.md.
;
; lib_extra_dirs reusa DigitalPin, Logger y RfReceiver de firmware/lib/ sin
; duplicarlos: PlatformIO solo linkea lo que este proyecto realmente
; #include-ea, asi que los modulos especificos de RF (RfTransmitter,
; backend_client) y el Config.h del porton quedan visibles pero no se
; compilan si no se usan.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_extra_dirs = ../firmware/lib
; Guarda toda la sesion del monitor a un archivo en .pio/ -- el volcado de una
; captura llena (miles de lineas) no entra en el scrollback de la terminal.
monitor_filters = log2file
